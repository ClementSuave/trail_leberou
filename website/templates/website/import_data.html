{% extends 'website/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container-fluid document-header"></div>
<div class="container">

  <div class="row p-4 document">

    <h1>Importer les données à partir d'un fichier:</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Import</button>
    </form>

  </div>

</div>

{% endblock %}
